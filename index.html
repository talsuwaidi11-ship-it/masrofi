<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مصروفي</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مصروفي">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first ledger. Four screens (dashboard, sections, reports, settings) under a fixed bottom bar; entry form and pickers slide up as sheets. */
:root{
  --bg:#f2f4f1; --surface:#ffffff; --raise:#f7f9f6; --ink:#16241d; --muted:#5d6c64; --faint:#8b978f; --line:#dfe5df;
  --accent:#0f6b4f; --accent-ink:#ffffff; --accent-soft:#e0eee7;
  --good:#1d7a3e; --good-soft:#e2f2e7; --warn:#9a6200; --warn-soft:#fbefd6; --bad:#b3392f; --bad-soft:#f8e2df;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Readex Pro",system-ui,sans-serif;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948;
  --navh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1411; --surface:#17201b; --raise:#1d2721; --ink:#e6eee9; --muted:#9daba3; --faint:#74827a; --line:#29342e;
  --accent:#4cc79a; --accent-ink:#06261a; --accent-soft:#173a2c;
  --good:#5fd08a; --good-soft:#163222; --warn:#f0b54a; --warn-soft:#3a2c10; --bad:#f0857a; --bad-soft:#3a1d1a;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#17201b; --raise:#1d2721; --ink:#e6eee9; --muted:#9daba3; --faint:#74827a; --line:#29342e;
  --accent:#4cc79a; --accent-ink:#06261a; --accent-soft:#173a2c;
  --good:#5fd08a; --good-soft:#163222; --warn:#f0b54a; --warn-soft:#3a2c10; --bad:#f0857a; --bad-soft:#3a1d1a;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}

.app{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:14px calc(var(--navh) + 96px)}
#view{display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{margin:0;font-family:var(--display);font-weight:700;font-size:24px;line-height:1.2}
.top p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.pillbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;color:var(--muted);white-space:nowrap}

.hero{background:var(--accent);color:var(--accent-ink);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px}
.hero .lbl{font-size:13px;opacity:.85}
.hero .big{font-family:var(--display);font-weight:700;font-size:40px;line-height:1.05}
.hero .big small{font-size:16px;font-weight:600;opacity:.85;margin-inline-start:6px}
.hero .delta{display:inline-flex;align-items:center;gap:6px;font-size:13px;background:rgba(255,255,255,.16);border-radius:999px;padding:4px 10px;width:fit-content}
.hero .chipsrow{display:flex;gap:8px;flex-wrap:wrap}
.hero .bchip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:10px;padding:6px 10px;font-size:13px}
.hero .bchip .dot{box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.hero .meta{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;opacity:.92}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{margin:0;font-family:var(--display);font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 .link{border:0;background:transparent;color:var(--accent);font-size:13px;font-family:var(--body);font-weight:500;padding:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.kpi{background:var(--raise);border-radius:12px;padding:10px 12px;min-width:0}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi b{font-family:var(--display);font-size:17px;font-weight:600}

.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar i+i{margin-inline-start:2px}
.split{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.split b{color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}

.rows{display:flex;flex-direction:column;gap:10px}
.catrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px 10px}
.catrow .name{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow .name small{color:var(--muted);font-size:12px}
.catrow .amt{font-size:14px;font-weight:600}
.catrow .bar{grid-column:1/-1;height:6px}

.proj{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;text-align:start;width:100%}
.proj h4{margin:0;font-family:var(--display);font-size:16px;font-weight:600}
.proj .sub{font-size:12px;color:var(--muted)}
.proj .amt{font-family:var(--display);font-size:18px;font-weight:600}
.ring{width:64px;height:64px}
.ring text{font-family:var(--display);font-size:14px;font-weight:600;fill:var(--ink)}

.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .axis{font-size:10px;fill:var(--faint);font-family:var(--body)}
.chart .gridl{stroke:var(--line);stroke-width:1}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit.on{fill:var(--accent-soft);opacity:.6}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tip{background:var(--raise);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:4px;min-height:44px}
.tip .t{font-weight:600}
.tip .r{display:flex;justify-content:space-between;gap:10px}

.due{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.due:last-child{border-bottom:0}
.due .t{min-width:0;cursor:pointer}
.due .t b{display:block;font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.due .t span{font-size:12px;color:var(--muted)}
.due .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:600;white-space:nowrap;font-family:var(--body)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--good-soft);color:var(--good)}
.tag.plain{background:var(--raise);color:var(--muted)}
.paybtn{border:0;background:var(--accent-soft);color:var(--accent);border-radius:9px;padding:5px 10px;font-size:12px;font-weight:600}

.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.search{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:16px;min-width:0;width:100%}
.group{display:flex;flex-direction:column}
.ghead{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding-block:8px 4px;border-bottom:1px solid var(--line)}
.item{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:12px;padding-block:10px;border:0;background:transparent;text-align:start;width:100%;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:15px}
.item .t{min-width:0}
.item .t b{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-weight:500;font-size:14px}
.item .t span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .a{font-weight:600;font-size:15px;text-align:end}
.item .a small{display:block;font-size:11px;font-weight:400;color:var(--muted)}
.item.isdue .a{color:var(--warn)}
.empty{text-align:center;color:var(--muted);padding:26px 8px;display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--ink);font-family:var(--display);font-weight:600}

.switch{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:0 16px 2px}
.switch::-webkit-scrollbar{display:none}
.switch button{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500}
.switch button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.switch button.add{color:var(--accent);border-style:dashed}
.monthnav{display:flex;align-items:center;justify-content:space-between}
.monthnav button{border:0;background:transparent;font-size:22px;width:44px;height:44px;border-radius:12px;color:var(--muted)}
.monthnav h2{margin:0;font-family:var(--display);font-weight:600;font-size:17px}

.nav{position:fixed;inset-inline:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--navh)}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--faint)}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent);font-weight:600}
.fab{position:fixed;z-index:6;bottom:calc(var(--navh) + 16px + env(safe-area-inset-bottom,0px));left:max(16px,calc(50% - 294px));border:0;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:600;font-size:16px;padding:14px 20px;box-shadow:0 6px 18px rgba(0,0,0,.22)}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--surface);width:100%;max-width:620px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:94%;overflow-y:auto}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.6}}}
.sheet h3{margin:0;font-family:var(--display);font-size:18px;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lab{font-size:13px;color:var(--muted)}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:16px;width:100%;min-width:0}
.amount-in{font-family:var(--display);font-size:30px!important;font-weight:600;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.btn{border:0;border-radius:14px;padding:13px;font-weight:600;font-size:15px;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.6}
.err{color:var(--bad);font-size:13px;min-height:1em}
.note{font-size:13px;color:var(--muted);margin:0}
.receipt{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.receipt img{width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid var(--line);cursor:zoom-in}
.filebtn{position:relative;overflow:hidden;display:inline-flex}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.viewer{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;padding:16px}
.viewer img{max-width:100%;max-height:100%;border-radius:8px}

.set{display:flex;flex-direction:column;gap:10px}
.setrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.setrow input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font-size:16px;width:100%;min-width:0}
.mini{border:0;border-radius:10px;padding:8px 12px;font-size:13px;background:var(--raise);color:var(--ink)}
.mini.danger{background:var(--bad-soft);color:var(--bad)}
.secbox{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.secbox .hd{display:flex;align-items:center;gap:10px}
.secbox .hd input{flex:1;font-family:var(--display);font-weight:600}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--bad);background:var(--bad-soft);border-radius:10px;padding:8px 10px}
.addrow{display:flex;gap:8px}
.addrow select{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 6px;font-size:14px;max-width:42%}
.share{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.share .lab{font-size:13px;color:var(--muted)}
.share .who{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.share .setrow{grid-template-columns:auto 1fr auto auto}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font-size:16px}
textarea.backup{font-family:ui-monospace,Menlo,monospace;font-size:12px!important;min-height:100px;direction:ltr}

.lock{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px}
.lock h2{margin:0;font-family:var(--display);font-size:20px;text-align:center}
.pins{display:flex;gap:14px;direction:ltr}
.pins i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.pins i.on{background:var(--ink);border-color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;direction:ltr}
.pad button{height:72px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-family:var(--display);font-size:24px}
.pad button.txt{font-size:13px;border:0;background:transparent;color:var(--muted)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline:16px;margin:auto;max-width:360px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;text-align:center;font-size:14px;z-index:50}

/* Report pages: printed A4 document, deliberately light in both themes */
#rpStage{position:fixed;top:0;left:-20000px;pointer-events:none}
.rp-page{width:794px;height:1123px;background:#ffffff;color:#1b2520;padding:56px 56px 48px;display:flex;flex-direction:column;gap:18px;font-family:var(--body);font-size:12.5px;line-height:1.5;direction:rtl}
.rp-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #0f6b4f;padding-bottom:12px}
.rp-head h1{margin:0;font-family:var(--display);font-size:24px;font-weight:700;color:#0f6b4f}
.rp-head p{margin:2px 0 0;color:#5f6e66;font-size:12px}
.rp-kpis{display:flex;gap:10px}
.rp-kpi{flex:1;border:1px solid #dde3dd;border-radius:8px;padding:10px 12px}
.rp-kpi span{display:block;color:#5f6e66;font-size:11px}
.rp-kpi b{font-family:var(--display);font-size:17px}
.rp-page h2{margin:0;font-family:var(--display);font-size:15px;font-weight:600}
.rp-page table{width:100%;border-collapse:collapse}
.rp-page th{text-align:start;font-weight:600;font-size:11px;color:#5f6e66;border-bottom:1px solid #b9c4bd;padding:6px}
.rp-page td{padding:6px;border-bottom:1px solid #e6ebe7;vertical-align:top}
.rp-page .n{text-align:left;font-variant-numeric:tabular-nums;direction:ltr;white-space:nowrap}
.rp-page tfoot td{font-weight:700;border-top:2px solid #1b2520;border-bottom:0}
.rp-page .rp-due td{color:#9a6200}
.rp-body{flex:1;display:flex;flex-direction:column;gap:18px;overflow:hidden}
.rp-foot{display:flex;justify-content:space-between;color:#8a968f;font-size:11px;border-top:1px solid #e6ebe7;padding-top:8px}
</style></head><body style="margin:0">

<div class="app" id="app" dir="rtl" lang="ar"><div id="view"></div></div>

<button class="fab" type="button" id="fab" dir="rtl">+ عملية جديدة</button>

<nav class="nav" dir="rtl" lang="ar" aria-label="التنقل">
  <div class="in">
    <button type="button" data-go="home" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>الرئيسية</button>
    <button type="button" data-go="book"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M8 14h5"/></svg>الأقسام</button>
    <button type="button" data-go="reports"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 13v4M12 10v7M15 14v3"/></svg>التقارير</button>
    <button type="button" data-go="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>الإعدادات</button>
  </div>
</nav>

<div class="scrim" id="formScrim" hidden>
  <form class="sheet" id="form" dir="rtl" lang="ar" novalidate>
    <h3 id="formTitle">عملية جديدة</h3>
    <div class="field" id="fBookWrap"><span class="lab">القسم</span><div class="chips" id="fBooks"></div></div>
    <div class="field"><label for="fAmount">المبلغ</label><input class="amount-in num" id="fAmount" inputmode="decimal" autocomplete="off" placeholder="0.00"></div>
    <div class="field"><span class="lab">الفئة</span><div class="chips" id="fCats"></div></div>
    <div class="field"><span class="lab">الحالة</span>
      <div class="seg" id="fStatus"><button type="button" data-v="paid" aria-pressed="true">مدفوع</button><button type="button" data-v="due" aria-pressed="false">مستحق (لم يُدفع بعد)</button></div>
    </div>
    <div class="row">

<script>
(function(){
  'use strict';

  var TPL={

  // ---------- utils ----------
  function firstOfMonth(d){return new Date(d.getFullYear(),d.getMonth(),1)}

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}

  }
  // Receipt photos live in IndexedDB (too big for localStorage)

    return idb;
  }
  function rput(id,data){return db().then(function(d){return new Promise(function(res,rej){var t=d.transaction('receipts','readwrite'); t.objectStore('receipts').put(data,id); t.oncomplete=res; t.onerror=function(){rej(t.error)}})})}

  function rdel(id){return db().then(function(d){d.transaction('receipts','readwrite').objectStore('receipts').delete(id)}).catch(function(){})}
  // ---------- cloud: account, sync between devices, sharing (Supabase) ----------
  // The publishable key is meant to be public; row-level security on the server decides who sees what.
  var CLOUD={url:'https://lkqwiruomkhmisqmdvai.supabase.co',key:'sb_publishable_tpW77D7GfMNrsuccklXIIg_KHKdQnD7'};
  var CK='masrofi.cloud', SBJS='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js';
  var IDRE=/^[A-Za-z0-9_-]{1,64}$/, DRE=/^\d{4}-\d{2}-\d{2}$/;
  var EK=['cat','amount','date','status','method','payee','ref','note','receipt','created','dueDate'];
  var cloud={sb:null,user:null,linked:null,busy:false,again:false,timer:null,last:0,err:'',first:false,replace:false,snap:{b:{},e:{}},meta:{},members:{},up:{},cursor:null};
  function cloudLoad(){try{var c=JSON.parse(localStorage.getItem(CK)||'null'); if(c){cloud.linked=c.linked||null; cloud.snap=c.snap||{b:{},e:{}}; cloud.meta=c.meta||{}; cloud.members=c.members||{}; cloud.up=c.up||{}; cloud.cursor=c.cursor||null; cloud.first=!!c.first; cloud.replace=!!c.replace}}catch(e){}}
  function cloudSave(){try{localStorage.setItem(CK,JSON.stringify({linked:cloud.linked,snap:cloud.snap,meta:cloud.meta,members:cloud.members,up:cloud.up,cursor:cloud.cursor,first:cloud.first,replace:cloud.replace}))}catch(e){}}
  function acct(){return cloud.user||cloud.linked}
  function ro(bid){var m=acct()&&cloud.meta[bid]; return !!(m&&m.role==='viewer')}
  function mine(bid){var m=cloud.meta[bid], u=acct(); return !u||!m||m.owner===u.id}
  function writable(){return state.books.filter(function(b){return !ro(b.id)})}
  function bookData(b){return {name:b.name,kind:b.kind,color:b.color,budget:b.budget||0,contract:b.contract||0,contractCat:b.contractCat||null,cats:b.cats.map(function(c){return {id:c.id,n:c.n,c:c.c,fixed:!!c.fixed}})}}
  function expData(e){var o={}; EK.forEach(function(k){if(e[k]!==undefined&&e[k]!==null)o[k]=e[k]}); return o}
  function bj(b){return JSON.stringify(bookData(b))}
  function ej(e){return JSON.stringify([e.book,expData(e)])}
  function cleanBook(id,d){
    if(!IDRE.test(id)||!d||typeof d!=='object')return null;
    var kind=d.kind==='monthly'?'monthly':'project', n8=function(v){return Math.min(8,Math.max(1,Math.round(+v)||8))};
    var cats=(Array.isArray(d.cats)?d.cats:[]).filter(function(c){return c&&IDRE.test(String(c.id))}).slice(0,80).map(function(c){return {id:String(c.id),n:String(c.n||'فئة').slice(0,30),c:n8(c.c),fixed:!!c.fixed}});
    var b={id:id,name:String(d.name||'قسم').slice(0,30),kind:kind,color:n8(d.color),budget:Math.max(0,+d.budget||0),contract:Math.max(0,+d.contract||0),cats:cats.length?cats:tpl(kind)};
    if(d.contractCat&&IDRE.test(String(d.contractCat)))b.contractCat=String(d.contractCat);
    return b;
  }
  function cleanExp(id,bid,d){
    if(!IDRE.test(id)||!IDRE.test(bid)||!d||!(+d.amount>0)||!DRE.test(d.date||''))return null;
    var e={id:id,book:bid,cat:IDRE.test(String(d.cat))?String(d.cat):'other',amount:Math.round(+d.amount*100)/100,date:d.date,status:d.status==='due'?'due':'paid',
      method:String(d.method||'').slice(0,20),payee:String(d.payee||'').slice(0,60),ref:String(d.ref||'').slice(0,40),note:String(d.note||'').slice(0,140),created:+d.created||0,
      receipt:d.receipt&&IDRE.test(String(d.receipt))?String(d.receipt):null};
    if(DRE.test(d.dueDate||''))e.dueDate=d.dueDate;
    return e;
  }
  function setBook(t,s){['name','kind','color','budget','contract','cats'].forEach(function(k){t[k]=s[k]}); if(s.contractCat)t.contractCat=s.contractCat; else delete t.contractCat}
  function setExp(t,s){t.book=s.book; EK.forEach(function(k){if(s[k]===undefined)delete t[k]; else t[k]=s[k]})}
  // ids get the account's suffix so two people's sections never clash on the server
  function scoped(id){var u=acct(), tag='-'+u.id.replace(/-/g,'').slice(0,8); id=IDRE.test(String(id))?String(id):uid(); return id.slice(-tag.length)===tag?id:id.slice(0,48)+tag}
  function remapLocal(){
    var m={}; state.books.forEach(function(b){m[b.id]=scoped(b.id); b.id=m[b.id]});
    state.expenses.forEach(function(e){e.book=m[e.book]||e.book; e.id=scoped(e.id)});
    if(ui.book)ui.book=m[ui.book]||null; ui.rp.book=m[ui.rp.book]||'all'; ui.catBook=null;
  }
  function wipeLocal(){
    try{localStorage.removeItem(KEY); localStorage.removeItem(CK)}catch(e){}
    db().then(function(d){d.transaction('receipts','readwrite').objectStore('receipts').clear()}).catch(function(){});
  }

  function cloudInit(){
    if(!CLOUD.url||cloud.sb)return;

      if(cloud.sb)return;
      cloud.sb=window.supabase.createClient(CLOUD.url,CLOUD.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'masrofi.auth'}});

        cloud.user=u;
        if(ev==='PASSWORD_RECOVERY')setTimeout(newPassword,400);
        // supabase-js asks not to call it from inside this callback
        if(u&&u.id!==was)setTimeout(linkAccount,0);
        if(ui.view==='settings')softRender();
      });
    }).catch(function(){cloud.err='net'; syncUI()});
  }
  function linkAccount(){
    var u=cloud.user; if(!u)return;
    if(cloud.linked&&cloud.linked.id===u.id){sync(); return}
    if(cloud.linked){ // a different account was on this device: start clean
      wipeLocal(); state.books=[]; state.expenses=[]; cloud.replace=true;
    }else{
      cloud.linked=u; remapLocal(); cloud.replace=!state.expenses.length;
    }
    cloud.linked=u; cloud.snap={b:{},e:{}}; cloud.meta={}; cloud.members={}; cloud.up={}; cloud.cursor=null; cloud.first=true;
    saveLocal(); cloudSave(); render(); sync();
  }
  function cloudKick(){if(!acct())return; clearTimeout(cloud.timer); cloud.timer=setTimeout(sync,1200)}
  function sync(){
    if(!cloud.sb||!cloud.user)return Promise.resolve(false);
    if(cloud.busy){cloud.again=true; return cloud.busy}
    clearTimeout(cloud.timer); cloud.err=''; syncUI();
    var run=cloud.first?pull().then(push):push().then(pull);
    cloud.busy=run.then(function(){cloud.first=false; cloud.last=Date.now(); cloudSave(); return true},function(e){cloud.err=errKind(e); cloudSave(); return false})
      .then(function(ok){cloud.busy=false; syncUI(); if(cloud.again){cloud.again=false; setTimeout(sync,50)} return ok});
    return cloud.busy;
  }
  function errKind(e){var m=String((e&&(e.message||e.error_description))||e||''); return /fetch|network|Failed|load/i.test(m)?'net':'server'}
  function ok(r){if(r&&r.error)throw r.error; return r&&r.data}
  function push(){
    var sb=cloud.sb, me=cloud.user.id, snap=cloud.snap, hb={}, have={};
    state.books.forEach(function(b){hb[b.id]=1}); state.expenses.forEach(function(e){have[e.id]=1});
    var bUp=[], bJ={}, eUp=[], eJ={};
    state.books.forEach(function(b){if(ro(b.id))return; var j=bj(b); if(snap.b[b.id]!==j){bUp.push({id:b.id,data:bookData(b)}); bJ[b.id]=j}});
    state.expenses.forEach(function(e){if(ro(e.book)||!hb[e.book])return; var j=ej(e); if(snap.e[e.id]!==j){eUp.push({id:e.id,book_id:e.book,data:expData(e),deleted:false}); eJ[e.id]=j}});
    Object.keys(snap.e).forEach(function(id){
      if(have[id])return; var bid=JSON.parse(snap.e[id])[0];
      if(hb[bid]&&!ro(bid)){eUp.push({id:id,book_id:bid,data:{},deleted:true}); eJ[id]=null}

    for(var i=0;i<eUp.length;i+=500)(function(part){
      p=p.then(function(){return sb.from('expenses').upsert(part)}).then(ok).then(function(){part.forEach(function(r){if(eJ[r.id]===null)delete snap.e[r.id]; else snap.e[r.id]=eJ[r.id]}); cloudSave()});
    })(eUp.slice(i,i+500));

      p=p.then(function(){return mine(id)?sb.from('books').delete().eq('id',id):sb.from('book_members').delete().eq('book_id',id).eq('user_id',me)}).then(ok).then(function(){
        delete snap.b[id]; delete cloud.meta[id]; delete cloud.members[id];

    });

  }
  function pushReceipts(){
    var todo=state.expenses.filter(function(e){return e.receipt&&cloud.up[e.receipt]!==e.book&&!ro(e.book)&&cloud.snap.b[e.book]}).slice(0,8);
    return todo.reduce(function(p,e){return p.then(function(){
      return rget(e.receipt).then(function(d){

  function pull(){

      mem.forEach(function(m){if(m.user_id===me)role[m.book_id]=m.role==='editor'?'editor':'viewer'; else (members[m.book_id]=members[m.book_id]||[]).push({user_id:m.user_id,email:String(m.email||''),role:m.role==='editor'?'editor':'viewer'})});
      cloud.members=members;

        var nb=cleanBook(String(row.id),row.data); if(!nb)return; seen[nb.id]=1;

        if(!b){state.books.push(nb); fresh.push(nb.id); snap.b[nb.id]=bj(nb); changed=true; return}
        var dirty=snap.b[b.id]===undefined?!cloud.first:snap.b[b.id]!==bj(b);

  // ---------- charts ----------
  // Stacked columns: series=[{name,color,values[]}]; tap or hover a column to see its breakdown in the box below
  var charts={};
  function columns(id,labels,series,opt){
    opt=opt||{};
    var W=340,H=150,padT=8,padB=22,padL=44,n=labels.length;
    var totals=labels.map(function(_,i){return series.reduce(function(s,se){return s+(se.values[i]||0)},0)});
    var max=Math.max.apply(null,totals.concat([1]));
    var step=Math.pow(10,Math.floor(Math.log10(max))), nice=Math.ceil(max/step)*step;
    var ticks=[0,nice/2,nice];
    var ih=H-padT-padB, iw=W-padL, cw=iw/n, bw=Math.max(3,Math.min(22,cw*0.6));
    var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.aria||'رسم بياني')+'" style="direction:ltr">';
    ticks.forEach(function(t){var y=padT+ih-(t/nice)*ih; s+='<line class="gridl" x1="'+padL+'" x2="'+W+'" y1="'+y+'" y2="'+y+'"/><text class="axis" x="'+(padL-6)+'" y="'+(y+3)+'" text-anchor="end">'+(t?compact(t):'0')+'</text>'});
    labels.forEach(function(l,i){
      var x=padL+cw*i+(cw-bw)/2, y=padT+ih;
      var segs=series.map(function(se){return {v:se.values[i]||0,c:se.color}}).filter(function(g){return g.v>0});
      segs.forEach(function(g,k){
        var h=g.v/nice*ih, top=k===segs.length-1, gap=k?2:0, hh=Math.max(0.5,h-gap);
        y-=h;
        var r=top?Math.min(3,bw/2,hh):0;
        if(r>0) s+='<path fill="'+g.c+'" d="M'+x+' '+(y+gap+hh)+'V'+(y+gap+r)+'q0 -'+r+' '+r+' -'+r+'h'+(bw-2*r)+'q'+r+' 0 '+r+' '+r+'V'+(y+gap+hh)+'z"/>';
        else s+='<rect fill="'+g.c+'" x="'+x+'" y="'+(y+gap)+'" width="'+bw+'" height="'+hh+'"/>';
      });
      if(!opt.every||i%opt.every===0||i===n-1) s+='<text class="axis" x="'+(padL+cw*i+cw/2)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(l)+'</text>';
    });
    labels.forEach(function(_,i){s+='<rect class="hit" data-chart="'+id+'" data-i="'+i+'" x="'+(padL+cw*i)+'" y="'+padT+'" width="'+cw+'" height="'+ih+'"/>'});
    s+='</svg>';
    charts[id]={labels:opt.full||labels,series:series,totals:totals};
    var leg=series.length>1?'<div class="legend">'+series.map(function(se){return '<span><i class="dot" style="background:'+se.color+'"></i>'+esc(se.name)+'</span>'}).join('')+'</div>':'';
    var last=n-1; for(var j=n-1;j>=0;j--){if(totals[j]>0){last=j;break}}
    return '<div class="chart">'+s+'</div>'+leg+'<div class="tip" id="tip-'+id+'" aria-live="polite">'+tipHtml(id,last)+'</div>';
  }

    save(); toast('تم الحفظ'); render();
  });

  // ---------- lock ----------
  var lockMode='unlock', entry='', firstPin='';
  function hash(p){
    var s='masrofi:'+p;
    if(window.crypto&&crypto.subtle&&window.TextEncoder) return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,'0')}).join('')});
    var h=0; for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0} return Promise.resolve('x'+h);
  }
  function showLock(mode){lockMode=mode; entry=''; firstPin=''; $('lockTitle').textContent=mode==='set'?'اختر رمز من 4 أرقام':'أدخل الرمز'; $('lockNote').textContent=''; $('lockCancel').style.visibility=mode==='set'?'visible':'hidden'; dots(); $('lock').hidden=false}
  function dots(){Array.prototype.forEach.call($('pins').children,function(d,i){d.classList.toggle('on',i<entry.length)})}
  $('pad').addEventListener('click',function(ev){
    var b=ev.target.closest('button'); if(!b)return;
    if(b.dataset.k==='cancel'){$('lock').hidden=true; return}
    if(b.dataset.k==='back'){entry=entry.slice(0,-1); dots(); return}
    if(entry.length>=4)return;
    entry+=b.textContent.trim(); dots();
    if(entry.length<4)return;
    var p=entry;
    setTimeout(function(){
      if(lockMode==='unlock'){hash(p).then(function(h){if(h===state.pin){$('lock').hidden=true}else{entry=''; dots(); $('pins').classList.remove('shake'); void $('pins').offsetWidth; $('pins').classList.add('shake'); $('lockNote').textContent='الرمز غير صحيح'}})}
      else if(!firstPin){firstPin=p; entry=''; dots(); $('lockTitle').textContent='أعد كتابة الرمز للتأكيد'}
      else if(firstPin===p){hash(p).then(function(h){state.pin=h; save(); $('lock').hidden=true; render(); toast('تم تفعيل القفل')})}
      else{firstPin=''; entry=''; dots(); $('lockTitle').textContent='الرمزين مختلفين، اختر رمز من جديد'}
    },120);
  });

  // ---------- backup ----------
  function exportData(receipts){var o={app:'masrofi',v:4,exported:new Date().toISOString(),currency:state.currency,books:state.books,expenses:state.expenses}; if(receipts)o.receipts=receipts; return o}
  function backupFile(){
    var withR=state.expenses.filter(function(e){return e.receipt});
    Promise.all(withR.map(function(e){return receiptSrc(e).then(function(d){return [e.receipt,d]})})).then(function(pairs){
      var rec={}; pairs.forEach(function(p){if(p[1])rec[p[0]]=p[1]});
      return saveFile('masrofi-backup-'+today()+'.json',JSON.stringify(exportData(rec)),'تم حفظ النسخة الاحتياطية');
    });
  }
  function restore(){
    var d; try{d=JSON.parse($('bkText').value)}catch(e){$('bkErr').textContent='النص أو الملف غير صالح.'; return}
    var list=Array.isArray(d)?d:(d&&d.expenses); if(!Array.isArray(list)){$('bkErr').textContent='ما لقيت عمليات في هذه النسخة.'; return}
    if(!Array.isArray(d)&&Array.isArray(d.books)){
      d.books.forEach(function(nb){
        if(!nb||!nb.id)return;
        if(acct()){nb=Object.assign({},nb,{id:scoped(nb.id)})}
        var b=book(nb.id); if(b&&ro(b.id))return;
        if(!b){state.books.push({id:String(nb.id),name:String(nb.name||'قسم').slice(0,30),kind:nb.kind==='monthly'?'monthly':'project',color:+nb.color||8,budget:+nb.budget||0,contract:+nb.contract||0,contractCat:nb.contractCat?String(nb.contractCat):undefined,cats:(nb.cats||[]).filter(function(c){return c&&c.id}).map(function(c){return {id:String(c.id),n:String(c.n||'فئة').slice(0,30),c:+c.c||8,fixed:!!c.fixed}})}); return}
        (nb.cats||[]).forEach(function(c){if(c&&c.id&&!b.cats.some(function(x){return x.id===c.id}))b.cats.push({id:String(c.id),n:String(c.n||'فئة').slice(0,30),c:+c.c||8})});
        if(!b.contract&&+nb.contract>0)b.contract=+nb.contract; if(!b.budget&&+nb.budget>0)b.budget=+nb.budget;
      });
    }else if(!Array.isArray(d)&&+d.contract>0&&book('house')&&!book('house').contract){book('house').contract=+d.contract}
    var have={}; state.expenses.forEach(function(e){have[e.id]=1});
    var added=0, jobs=[];
    list.forEach(function(e){
      if(e&&acct())e=Object.assign({},e,{id:scoped(e.id),book:scoped(e.book)});
      if(!e||have[e.id]||!(+e.amount>0)||!/^\d{4}-\d{2}-\d{2}$/.test(e.date||''))return;
      var wb=writable(), bid=book(e.book)&&!ro(e.book)?e.book:wb[0].id, b=book(bid);
      var cid=b.cats.some(function(c){return c.id===e.cat})?e.cat:moveTarget(b,'').id;
      var ne={id:String(e.id||uid()),book:bid,cat:cid,amount:Math.round(+e.amount*100)/100,date:e.date,status:e.status==='due'?'due':'paid',method:String(e.method||'').slice(0,20),payee:String(e.payee||'').slice(0,60),ref:String(e.ref||'').slice(0,40),note:String(e.note||'').slice(0,140),created:+e.created||Date.now(),receipt:null};
      if(e.receipt&&d.receipts&&typeof d.receipts[e.receipt]==='string'&&/^data:image\/(jpeg|png|webp);base64,/.test(d.receipts[e.receipt])){var rid=String(e.receipt); jobs.push(rput(rid,d.receipts[e.receipt]).then(function(){ne.receipt=rid},function(){}))}
      state.expenses.push(ne); added++;
    });
    if(!Array.isArray(d)&&d.currency)state.currency=String(d.currency).slice(0,10);
    Promise.all(jobs).then(function(){save(); toast('تم استرجاع '+added+' عملية'); go('home')});
  }

  // ---------- reports ----------
  var libs={};
  function need(name,src,test){if(test())return Promise.resolve(); if(!libs[name])libs[name]=loadScript(src).catch(function(e){libs[name]=null; throw e}); return libs[name]}
  function rpTitle(){return ui.rp.book==='all'?'كل الأقسام':book(ui.rp.book).name}
  function rpFileBase(){return 'تقرير '+rpTitle()+' '+(ui.rp.from||'')+(ui.rp.to?' - '+ui.rp.to:'')}
  function makePdf(btn){
    var rows=rpRows(), rp=ui.rp;
    if(rp.from&&rp.to&&rp.from>rp.to){$('rpErr').textContent='تاريخ «من» بعد تاريخ «إلى».'; return}
    if(!rows.length){$('rpErr').textContent='ما في عمليات في هذه الفترة.'; return}
    $('rpErr').textContent=''; btn.disabled=true; var old=btn.textContent; btn.textContent='جاري التجهيز...';
    Promise.all([need('h2c','https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',function(){return !!window.html2canvas}),
                 need('jspdf','https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',function(){return !!(window.jspdf&&window.jspdf.jsPDF)}),
                 document.fonts?document.fonts.ready:1]).then(function(){
      var pages=buildPages(rows), pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'}), chain=Promise.resolve();
      pages.forEach(function(p,i){chain=chain.then(function(){return window.html2canvas(p,{scale:2,backgroundColor:'#ffffff',logging:false})}).then(function(c){if(i)pdf.addPage(); pdf.addImage(c.toDataURL('image/jpeg',0.9),'JPEG',0,0,210,297)})});
      return chain.then(function(){$('rpStage').innerHTML=''; return saveFile(rpFileBase()+'.pdf',pdf.output('blob'),'تم حفظ التقرير')});
    }).catch(function(){$('rpErr').textContent='تجهيز التقرير يحتاج إنترنت. تأكد إنك متصل وجرب مرة ثانية.'})
      .then(function(){btn.disabled=false; btn.textContent=old});
  }
  function buildPages(rows){
    var stage=$('rpStage'); stage.innerHTML='';
    var rp=ui.rp, all=rp.book==='all', b=all?null:book(rp.book), cur=state.currency;
    var P=paid(rows), D=dues(rows), tp=sum(P), td=sum(D);
    var period=(rp.from?dlabel(rp.from):'البداية')+' إلى '+(rp.to?dlabel(rp.to):'اليوم'), made=dlabel(today());
    var k='<div class="rp-kpis"><div class="rp-kpi"><span>مدفوع ('+esc(cur)+')</span><b class="num">'+fmt(tp)+'</b></div><div class="rp-kpi"><span>مستحق</span><b class="num">'+fmt(td)+'</b></div><div class="rp-kpi"><span>عدد العمليات</span><b class="num">'+rows.length+'</b></div>';
    if(b&&b.kind==='project'){
      var paidAll=sum(paid(inBook(b.id)).filter(function(e){return e.cat===contractCat(b)&&(!rp.to||e.date<=rp.to)}));
      if(b.contract>0)k+='<div class="rp-kpi"><span>المتبقي من العقد</span><b class="num">'+fmt(b.contract-paidAll)+'</b></div>';
      else if(b.budget>0)k+='<div class="rp-kpi"><span>الميزانية</span><b class="num">'+fmt(b.budget)+'</b></div>';
    }
    k+='</div>';
    if(b&&b.kind==='project'&&(b.contract>0||b.budget>0))k+='<p style="margin:0;color:#5f6e66;font-size:12px">'+(b.contract>0?'قيمة عقد المقاول: <b class="num" style="color:#1b2520">'+fmt(b.contract)+'</b> '+esc(cur)+'. ':'')+(b.budget>0?'ميزانية المشروع: <b class="num" style="color:#1b2520">'+fmt(b.budget)+'</b> '+esc(cur)+'.':'')+'</p>';
    var groupKey=all?function(e){return e.book}:function(e){return e.cat};
    var gl=all?function(key){return book(key)?book(key).name:''}:function(key){return catOf(b,key).n};
    var by={}; P.forEach(function(e){var g=groupKey(e); by[g]=(by[g]||0)+e.amount});
    var t1=Object.keys(by).length?'<h2>'+(all?'حسب القسم':'حسب الفئة')+'</h2><table><thead><tr><th>'+(all?'القسم':'الفئة')+'</th><th class="n">النسبة</th><th class="n">المبلغ</th></tr></thead><tbody>'+
      Object.keys(by).sort(function(a,c){return by[c]-by[a]}).map(function(key){return '<tr><td>'+esc(gl(key))+'</td><td class="n">'+(tp?Math.round(by[key]/tp*100):0)+'%</td><td class="n">'+fmt(by[key])+'</td></tr>'}).join('')+'</tbody></table>':'';
    var bp={}; P.forEach(function(e){if(e.payee)bp[e.payee]=(bp[e.payee]||0)+e.amount});
    var t2=Object.keys(bp).length?'<h2>حسب الجهة</h2><table><thead><tr><th>الجهة</th><th class="n">المبلغ</th></tr></thead><tbody>'+Object.keys(bp).sort(function(a,c){return bp[c]-bp[a]}).slice(0,12).map(function(key){return '<tr><td>'+esc(key)+'</td><td class="n">'+fmt(bp[key])+'</td></tr>'}).join('')+'</tbody></table>':'';
    var showPayee=rows.some(function(e){return e.payee}), showMethod=rows.some(function(e){return e.method});
    var cols=2+(all?1:0)+(showPayee?1:0)+(showMethod?1:0)+2;
    var thead='<thead><tr><th style="width:84px">التاريخ</th>'+(all?'<th>القسم</th>':'')+'<th>الفئة</th>'+(showPayee?'<th>الجهة</th>':'')+(showMethod?'<th>الدفع</th>':'')+'<th>ملاحظة</th><th class="n">المبلغ</th></tr></thead>';
    function rowHtml(e){var due=e.status==='due'; return '<tr'+(due?' class="rp-due"':'')+'><td class="num" style="direction:ltr;text-align:right">'+e.date+'</td>'+(all?'<td>'+esc(book(e.book).name)+'</td>':'')+'<td>'+esc(cat(e).n)+'</td>'+(showPayee?'<td>'+esc(e.payee)+'</td>':'')+(showMethod?'<td>'+esc(e.method)+'</td>':'')+'<td>'+(due?'(مستحق) ':'')+esc([e.note,e.ref?'رقم '+e.ref:''].filter(Boolean).join(' · '))+'</td><td class="n">'+fmt(e.amount)+'</td></tr>'}
    var pages=[];
    function page(first){var p=document.createElement('div'); p.className='rp-page';
      p.innerHTML='<div class="rp-head"><div><h1>'+esc((first?'تقرير ':'')+rpTitle())+'</h1><p>الفترة: '+period+'</p></div><p>مصروفي · '+made+'</p></div><div class="rp-body"></div><div class="rp-foot"><span>المبالغ بال'+esc(cur)+(td?' · الأسطر البرتقالية دفعات مستحقة':'')+'</span><span class="pg"></span></div>';
      stage.appendChild(p); pages.push(p); return p.querySelector('.rp-body')}
    function fits(x){return x.scrollHeight<=x.clientHeight+1}
    var body=page(true); body.innerHTML=k+t1+t2;
    var h=document.createElement('h2'); h.textContent='تفاصيل العمليات'; body.appendChild(h);
    function table(x){var t=document.createElement('table'); t.innerHTML=thead+'<tbody></tbody>'; x.appendChild(t); return t.querySelector('tbody')}
    var tb=table(body);
    if(!fits(body)){h.remove(); tb.parentNode.remove(); body=page(false); body.appendChild(h); tb=table(body)}
    rows.forEach(function(e){tb.insertAdjacentHTML('beforeend',rowHtml(e)); if(!fits(body)){tb.lastElementChild.remove(); body=page(false); tb=table(body); tb.insertAdjacentHTML('beforeend',rowHtml(e))}});
    var tf=document.createElement('tfoot'); tf.innerHTML='<tr><td colspan="'+(cols-1)+'">المجموع المدفوع</td><td class="n">'+fmt(tp)+'</td></tr>'+(td?'<tr><td colspan="'+(cols-1)+'" style="border-top:0">المستحق</td><td class="n" style="border-top:0">'+fmt(td)+'</td></tr>':'');
    tb.parentNode.appendChild(tf);
    if(!fits(body)){tf.remove(); body=page(false); var t3=document.createElement('table'); t3.appendChild(tf); body.appendChild(t3)}
    pages.forEach(function(p,i){p.querySelector('.pg').textContent='صفحة '+(i+1)+' من '+pages.length});
    return pages;
  }
  function makeXlsx(btn){
    var rows=rpRows(); if(!rows.length){$('rpErr').textContent='ما في عمليات في هذه الفترة.'; return}
    $('rpErr').textContent=''; btn.disabled=true; var old=btn.textContent; btn.textContent='جاري التجهيز...';
    need('xlsx','https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',function(){return !!window.XLSX}).then(function(){
      var X=window.XLSX, wb=X.utils.book_new();
      var head=['التاريخ','القسم','الفئة','الحالة','الجهة','طريقة الدفع','رقم الفاتورة','ملاحظة','المبلغ'];
      var data=rows.map(function(e){return [e.date,book(e.book).name,cat(e).n,e.status==='due'?'مستحق':'مدفوع',e.payee||'',e.method||'',e.ref||'',e.note||'',e.amount]});
      var ws=X.utils.aoa_to_sheet([head].concat(data)); ws['!cols']=[{wch:11},{wch:18},{wch:16},{wch:8},{wch:18},{wch:12},{wch:12},{wch:30},{wch:12}];
      X.utils.book_append_sheet(wb,ws,'العمليات');
      var sumRows=[['القسم','الفئة','مدفوع','مستحق']], keys={};
      rows.forEach(function(e){var key=e.book+'|'+e.cat; keys[key]=keys[key]||[book(e.book).name,cat(e).n,0,0]; keys[key][e.status==='due'?3:2]+=e.amount});
      Object.keys(keys).forEach(function(key){sumRows.push(keys[key])});
      sumRows.push(['المجموع','',sum(paid(rows)),sum(dues(rows))]);
      var ws2=X.utils.aoa_to_sheet(sumRows); ws2['!cols']=[{wch:20},{wch:18},{wch:14},{wch:14}];
      X.utils.book_append_sheet(wb,ws2,'الملخص');
      wb.Workbook={Views:[{RTL:true}]};
      var out=X.write(wb,{bookType:'xlsx',type:'array'});
      return saveFile(rpFileBase()+'.xlsx',new Blob([out]),'تم حفظ ملف Excel');
    }).catch(function(){$('rpErr').textContent='تجهيز الملف يحتاج إنترنت. تأكد إنك متصل وجرب مرة ثانية.'})
      .then(function(){btn.disabled=false; btn.textContent=old});
  }

  cloudLoad(); load(); render();
  if(state.pin)showLock('unlock');
  cloudInit();
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')sync()});
  window.addEventListener('online',function(){if(cloud.sb)sync(); else cloudInit()});
  setInterval(function(){if(document.visibilityState==='visible')sync()},45000);
})();
</script>
