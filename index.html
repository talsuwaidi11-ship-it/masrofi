<link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/1179x2556.png">
<link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/1284x2778.png">
<link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/1170x2532.png">
<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/1125x2436.png">

<link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash/828x1792.png">
<link rel="apple-touch-startup-image" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/1260x2736.png">
<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash/750x1334.png">

<style>
/* Layout: phone-first ledger. Four tabs (home, transactions, reports, settings) with a central add button; the entry form and pickers slide up as sheets. */
:root{
  --bg:#f2f4f1; --surface:#ffffff; --raise:#f4f7f3; --ink:#14221b; --muted:#56655d; --faint:#7f8c85; --line:#dde4dd;
  --accent:#0f6b4f; --accent-ink:#ffffff; --accent-soft:#e0eee7;
  --good:#1d7a3e; --good-soft:#e2f2e7; --warn:#8f5b00; --warn-soft:#fbefd6; --bad:#b3392f; --bad-soft:#f8e2df;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Readex Pro",system-ui,sans-serif;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948;
  --navh:64px; --shadow:0 1px 2px rgba(20,34,27,.05),0 4px 14px rgba(20,34,27,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1310; --surface:#161f1a; --raise:#1c2620; --ink:#e7efea; --muted:#a3b0a8; --faint:#7b887f; --line:#26312b;
  --accent:#4cc79a; --accent-ink:#06261a; --accent-soft:#173a2c;
  --good:#5fd08a; --good-soft:#163222; --warn:#f0b54a; --warn-soft:#3a2c10; --bad:#f0857a; --bad-soft:#3a1d1a;
  --c1:#4b93ea; --c2:#e66a36; --c3:#22b07e; --c4:#d99a12; --c5:#de6493; --c6:#2a9a2a; --c7:#9085e9; --c8:#ea6f6f;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1310; --surface:#161f1a; --raise:#1c2620; --ink:#e7efea; --muted:#a3b0a8; --faint:#7b887f; --line:#26312b;
  --accent:#4cc79a; --accent-ink:#06261a; --accent-soft:#173a2c;
  --good:#5fd08a; --good-soft:#163222; --warn:#f0b54a; --warn-soft:#3a2c10; --bad:#f0857a; --bad-soft:#3a1d1a;
  --c1:#4b93ea; --c2:#e66a36; --c3:#22b07e; --c4:#d99a12; --c5:#de6493; --c6:#2a9a2a; --c7:#9085e9; --c8:#ea6f6f;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}

.app{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(var(--navh) + 28px + env(safe-area-inset-bottom,0px))}
#view{display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.top h1{margin:0;font-family:var(--display);font-weight:700;font-size:26px;line-height:1.2}
.top p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.top .acts{display:flex;gap:8px;align-items:center}
.pillbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:40px;padding:8px 14px;font-size:14px;color:var(--ink);white-space:nowrap}
.iconbtn{border:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;width:44px;height:44px;display:grid;place-items:center;font-size:18px;color:var(--ink);flex:none}
.back{border:0;background:transparent;color:var(--accent);font-size:16px;font-weight:500;padding:10px 0;min-height:44px;display:inline-flex;align-items:center;gap:4px}

.hero{background:linear-gradient(160deg,#13805e,#0c5c43);color:#fff;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero{background:linear-gradient(160deg,#17543f,#0f3b2c)}}
.hero .lbl{font-size:14px;opacity:.9}
.hero .big{font-family:var(--display);font-weight:700;font-size:40px;line-height:1.05}
.hero .big small{font-size:16px;font-weight:600;opacity:.85;margin-inline-start:6px}
.hero .hbar{height:10px;border-radius:10px;background:rgba(255,255,255,.22);overflow:hidden}
.hero .hbar i{display:block;height:100%;border-radius:10px;background:#fff}
.hero .hbar i.over{background:#ffb4a8}
.hero .line{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px}
.hero .line b{font-weight:600}
.hero .pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;background:rgba(255,255,255,.16);border-radius:999px;padding:5px 11px;width:fit-content}
.hero .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;opacity:.95}
.hero .setb{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:12px;padding:9px 14px;font-size:14px;width:fit-content;min-height:40px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.card h3{margin:0;font-family:var(--display);font-size:16px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:24px}
.card h3 .link,.link{border:0;background:transparent;color:var(--accent);font-size:14px;font-family:var(--body);font-weight:500;padding:8px 0;min-height:40px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}
.kpi{background:var(--raise);border-radius:14px;padding:10px 12px;min-width:0}
.kpi>span{display:block;font-size:12px;color:var(--muted)}
.kpi b{font-family:var(--display);font-size:17px;font-weight:600}

.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar i+i{margin-inline-start:2px}
.split{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.split b{color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;border:0;border-radius:16px;padding:10px 12px;text-align:start;width:100%;min-height:52px;font-size:14px}
.alert .ai{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:rgba(255,255,255,.55)}
.alert b{font-weight:600}
.alert .chev{opacity:.6;font-size:18px}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.info{background:var(--accent-soft);color:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .alert .ai{background:rgba(0,0,0,.2)}}

/* section cards */
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px 6px;scroll-snap-type:x proximity}
.hscroll::-webkit-scrollbar{display:none}
.scard{flex:none;width:168px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:start;box-shadow:var(--shadow)}
.scard .nm{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;min-width:0}
.scard .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scard .amt{font-family:var(--display);font-size:20px;font-weight:600;line-height:1.1}
.scard .sub{font-size:12px;color:var(--muted);min-height:18px}
.scard.add{align-items:center;justify-content:center;color:var(--accent);border-style:dashed;box-shadow:none;font-weight:600;width:120px}
.scard.add b{font-size:26px;font-weight:400;line-height:1}
.secttl{display:flex;justify-content:space-between;align-items:center;margin:4px 2px -6px}
.secttl h2{margin:0;font-family:var(--display);font-size:17px;font-weight:600}
.avs{display:inline-flex;direction:ltr;margin-inline-start:auto}
.av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;border:2px solid var(--surface);margin-left:-6px;text-transform:uppercase;font-family:var(--body)}
.av:first-child{margin-left:0}

/* donut */
.donutwrap{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center}
.donut{width:132px;height:132px;display:block}
.donut circle[data-txcat]{cursor:pointer}
.donut .c1{font-family:var(--display);font-size:16px;font-weight:700;fill:var(--ink)}
.donut .c2{font-size:10px;fill:var(--muted);font-family:var(--body)}
.legend2{display:flex;flex-direction:column;gap:2px;min-width:0}
.legend2 button{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:center;border:0;background:transparent;padding:6px 0;text-align:start;font-size:14px;min-height:36px;width:100%}
.legend2 .e{font-size:16px;text-align:center}
.legend2 .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend2 .p{color:var(--muted);font-size:13px}
@media (max-width:360px){.donutwrap{grid-template-columns:1fr;justify-items:center}}

.rows{display:flex;flex-direction:column;gap:12px}
.catrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px 10px}
.catrow .e{font-size:18px;width:24px;text-align:center}
.catrow .name{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow .name small{color:var(--muted);font-size:12px}
.catrow .amt{font-size:14px;font-weight:600;text-align:end}
.catrow .amt small{display:block;font-size:11px;font-weight:400;color:var(--muted)}
.catrow .bar{grid-column:1/-1;height:6px}
.ring{width:56px;height:56px;flex:none}
.ring text{font-family:var(--display);font-size:14px;font-weight:600;fill:var(--ink)}

.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .axis{font-size:10px;fill:var(--faint);font-family:var(--body)}
.chart .gridl{stroke:var(--line);stroke-width:1}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit.on{fill:var(--accent-soft);opacity:.6}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tip{background:var(--raise);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:4px;min-height:44px}
.tip .t{font-weight:600}
.tip .r{display:flex;justify-content:space-between;gap:10px}

.due{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.due:last-child{border-bottom:0}
.due .t{min-width:0;cursor:pointer}
.due .t b{display:block;font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.due .t span{font-size:12px;color:var(--muted)}
.due .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:600;white-space:nowrap;font-family:var(--body)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--good-soft);color:var(--good)}
.tag.plain{background:var(--raise);color:var(--muted)}
.paybtn{border:0;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;min-height:36px}

/* transactions */
.search{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 14px;font-size:16px;min-width:0;width:100%}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:0 16px 2px}
.filters::-webkit-scrollbar{display:none}
.fsel{position:relative;flex:none}
.fsel select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 30px 9px 14px;font-size:14px;min-height:40px;max-width:190px;color:var(--ink)}
.fsel select.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fsel::after{content:"▾";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:11px;pointer-events:none;color:var(--muted)}
.fsel:has(select.on)::after{color:var(--bg)}
.sumline{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.sumline b{color:var(--ink)}
.group{display:flex;flex-direction:column}
.ghead{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding-block:12px 4px;border-bottom:1px solid var(--line);font-weight:500}
.swipe{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.swipe:last-child{border-bottom:0}
.swipe .act{position:absolute;inset-block:0;display:flex;align-items:center;padding:0 18px;font-weight:600;font-size:14px;color:#fff;opacity:0}
.swipe .act.del{right:0;left:0;justify-content:flex-start;background:var(--bad)}
.swipe .act.dup{right:0;left:0;justify-content:flex-end;background:var(--accent)}
.swipe[data-dir="l"] .act.del{opacity:1}
.swipe[data-dir="r"] .act.dup{opacity:1}
.swipe .act.del{direction:ltr;justify-content:flex-end}
.swipe .act.dup{direction:ltr;justify-content:flex-start}
.item{position:relative;display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:12px;padding:10px 0;border:0;background:var(--surface);text-align:start;width:100%;min-height:60px}
.group>.item{border-bottom:1px solid var(--line)}
.group>.item:last-child{border-bottom:0}
.item .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px}
.item .t{min-width:0}
.item .t b{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-weight:500;font-size:15px}
.item .t span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .a{font-weight:600;font-size:15px;text-align:end}
.item .a small{display:block;font-size:11.5px;font-weight:400;color:var(--muted)}
.item.isdue .a{color:var(--warn)}
.more{border:1px solid var(--line);background:var(--raise);border-radius:12px;padding:10px;font-size:14px;width:100%;min-height:44px}
.empty{text-align:center;color:var(--muted);padding:26px 8px;display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--ink);font-family:var(--display);font-weight:600}
.empty .big{font-size:34px}

.titlesel{position:relative;display:inline-flex;align-items:center;gap:6px;max-width:100%}
.titlesel h1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titlesel select{position:absolute;inset:0;opacity:0;width:100%;font-size:16px}
.titlesel .chev{font-size:13px;color:var(--muted)}
.monthnav{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:2px}
.monthnav button{border:0;background:transparent;font-size:22px;width:44px;height:44px;border-radius:12px;color:var(--muted)}
.monthnav button:disabled{opacity:.3}
.monthnav h2{margin:0;font-family:var(--display);font-weight:600;font-size:16px}

/* tab bar */
.nav{position:fixed;inset-inline:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;height:var(--navh);align-items:center}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--faint);height:100%;min-width:44px}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent);font-weight:600}
.nav .addbtn{width:58px;height:58px;border-radius:20px;background:var(--accent);color:var(--accent-ink);margin:0 auto;transform:translateY(-14px);box-shadow:0 8px 20px rgba(15,107,79,.35);font-size:0}
.nav .addbtn svg{width:28px;height:28px;stroke-width:2.4}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--surface);width:100%;max-width:620px;border-radius:24px 24px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 10px - env(safe-area-inset-top,0px));overflow-y:auto;overscroll-behavior:contain}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.6}}}
.sheet h3{margin:0;font-family:var(--display);font-size:18px;font-weight:600}
.ehead{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.ehead h3{text-align:center}
.xbtn{border:0;background:var(--raise);width:40px;height:40px;border-radius:50%;font-size:16px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lab{font-size:13px;color:var(--muted)}

  // ---------- charts ----------
  // Stacked columns: series=[{name,color,values[]}]; tap or hover a column to see its breakdown in the box below
  var charts={};
  function columns(id,labels,series,opt){
    opt=opt||{};
    var W=340,H=150,padT=8,padB=22,padL=44,n=labels.length;
    var totals=labels.map(function(_,i){return series.reduce(function(s,se){return s+(se.values[i]||0)},0)});
    var max=Math.max.apply(null,totals.concat([1]));
    var step=Math.pow(10,Math.floor(Math.log10(max))), nice=Math.ceil(max/step)*step;
    var ticks=[0,nice/2,nice];
    var ih=H-padT-padB, iw=W-padL, cw=iw/n, bw=Math.max(3,Math.min(22,cw*0.6));
    var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.aria||'رسم بياني')+'" style="direction:ltr">';
    ticks.forEach(function(t){var y=padT+ih-(t/nice)*ih; s+='<line class="gridl" x1="'+padL+'" x2="'+W+'" y1="'+y+'" y2="'+y+'"/><text class="axis" x="'+(padL-6)+'" y="'+(y+3)+'" text-anchor="end">'+(t?compact(t):'0')+'</text>'});
    labels.forEach(function(l,i){
      var x=padL+cw*i+(cw-bw)/2, y=padT+ih;
      var segs=series.map(function(se){return {v:se.values[i]||0,c:se.color}}).filter(function(g){return g.v>0});
      segs.forEach(function(g,k){
        var h=g.v/nice*ih, top=k===segs.length-1, gap=k?2:0, hh=Math.max(0.5,h-gap);
        y-=h;
        var r=top?Math.min(3,bw/2,hh):0;
        if(r>0) s+='<path fill="'+g.c+'" d="M'+x+' '+(y+gap+hh)+'V'+(y+gap+r)+'q0 -'+r+' '+r+' -'+r+'h'+(bw-2*r)+'q'+r+' 0 '+r+' '+r+'V'+(y+gap+hh)+'z"/>';
        else s+='<rect fill="'+g.c+'" x="'+x+'" y="'+(y+gap)+'" width="'+bw+'" height="'+hh+'"/>';
      });
      if(!opt.every||i%opt.every===0||i===n-1) s+='<text class="axis" x="'+(padL+cw*i+cw/2)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(l)+'</text>';
    });
    labels.forEach(function(_,i){s+='<rect class="hit" data-chart="'+id+'" data-i="'+i+'" x="'+(padL+cw*i)+'" y="'+padT+'" width="'+cw+'" height="'+ih+'"/>'});
    s+='</svg>';
    charts[id]={labels:opt.full||labels,series:series,totals:totals};
    var leg=series.length>1?'<div class="legend">'+series.map(function(se){return '<span><i class="dot" style="background:'+se.color+'"></i>'+esc(se.name)+'</span>'}).join('')+'</div>':'';
    var last=n-1; for(var j=n-1;j>=0;j--){if(totals[j]>0){last=j;break}}
    return '<div class="chart">'+s+'</div>'+leg+'<div class="tip" id="tip-'+id+'" aria-live="polite">'+tipHtml(id,last)+'</div>';
  }
  function tipHtml(id,i){
    var c=charts[id]; if(!c)return '';
    var rows=c.series.filter(function(se){return (se.values[i]||0)>0}).map(function(se){return '<div class="r"><span><i class="dot" style="background:'+se.color+'"></i> '+esc(se.name)+'</span><b class="num">'+fmt(se.values[i])+'</b></div>'}).join('');

        if(Array.isArray(nb.cats)&&nb.cats.length)c.cats.forEach(function(x){if(!b.cats.some(function(y){return y.id===x.id}))b.cats.push(x)});
        if(!b.contract&&c.contract)b.contract=c.contract; if(!b.budget&&c.budget)b.budget=c.budget;
      });
    }else if(!Array.isArray(d)&&fin(d.contract)&&book('house')&&!book('house').contract){book('house').contract=fin(d.contract)}
    var wb=writable(); if(!wb.length){$('bkErr').textContent='ما عندك قسم تقدر تضيف فيه.'; return}
    var have={}; state.expenses.forEach(function(e){have[e.id]=1});
    var added=0, jobs=[];
    list.forEach(function(e){
      if(!e||typeof e!=='object')return;
      var id=newId(e.id,'x'); if(have[id])return;
      var ob=e.book==null?'':String(e.book); if(bmap[ob]===null||foreign(ob))return;
      var bid=bmap[ob]||(acct()?scoped(ob||'personal'):ob);
      if(!book(bid)||ro(bid))bid=wb[0].id;
      var ne=cleanExp(id,bid,Object.assign({},e,{receipt:null})); if(!ne)return;
      var b=book(bid); if(!b.cats.some(function(c){return c.id===ne.cat}))ne.cat=moveTarget(b,'').id;
      if(!ne.created)ne.created=Date.now();
      var img=e.receipt!=null&&d.receipts&&d.receipts[String(e.receipt)];
      if(typeof img==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(img)){var rid='r'+uid(); jobs.push(rput(rid,img).then(function(){ne.receipt=rid},function(){}))}
      state.expenses.push(ne); have[id]=1; added++;
    });
    if(!Array.isArray(d)&&d.currency)state.currency=String(d.currency).slice(0,10);
    Promise.all(jobs).then(function(){save(); toast('تم استرجاع '+added+' عملية'); go('home')});
  }

  // ---------- reports ----------
  var libs={};
  function need(name,src,test){if(test())return Promise.resolve(); if(!libs[name])libs[name]=loadScript(src).catch(function(e){libs[name]=null; throw e}); return libs[name]}
  function rpTitle(){return ui.rp.book==='all'?'كل الأقسام':book(ui.rp.book).name}
  function rpFileBase(){return 'تقرير '+rpTitle()+' '+(ui.rp.from||'')+(ui.rp.to?' - '+ui.rp.to:'')}
  function makePdf(btn){
    var rows=rpRows(), rp=ui.rp;
    if(rp.from&&rp.to&&rp.from>rp.to){$('rpErr').textContent='تاريخ «من» بعد تاريخ «إلى».'; return}
    if(!rows.length){$('rpErr').textContent='ما في عمليات في هذه الفترة.'; return}
    $('rpErr').textContent=''; btn.disabled=true; var old=btn.textContent; btn.textContent='جاري التجهيز...';
    Promise.all([need('h2c','https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',function(){return !!window.html2canvas}),
                 need('jspdf','https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',function(){return !!(window.jspdf&&window.jspdf.jsPDF)}),
                 document.fonts?document.fonts.ready:1]).then(function(){
      var pages=buildPages(rows), pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'}), chain=Promise.resolve();
      pages.forEach(function(p,i){chain=chain.then(function(){return window.html2canvas(p,{scale:2,backgroundColor:'#ffffff',logging:false})}).then(function(c){if(i)pdf.addPage(); pdf.addImage(c.toDataURL('image/jpeg',0.9),'JPEG',0,0,210,297)})});
      return chain.then(function(){$('rpStage').innerHTML=''; return saveFile(rpFileBase()+'.pdf',pdf.output('blob'),'تم حفظ التقرير')});
    }).catch(function(){$('rpErr').textContent='تجهيز التقرير يحتاج إنترنت. تأكد إنك متصل وجرب مرة ثانية.'})
      .then(function(){btn.disabled=false; btn.textContent=old});
  }
  function buildPages(rows){
    var stage=$('rpStage'); stage.innerHTML='';
    var rp=ui.rp, all=rp.book==='all', b=all?null:book(rp.book), cur=state.currency;
    var P=paid(rows), D=dues(rows), tp=sum(P), td=sum(D);
    var period=(rp.from?dlabel(rp.from):'البداية')+' إلى '+(rp.to?dlabel(rp.to):'اليوم'), made=dlabel(today());
    var k='<div class="rp-kpis"><div class="rp-kpi"><span>مدفوع ('+esc(cur)+')</span><b class="num">'+fmt(tp)+'</b></div><div class="rp-kpi"><span>مستحق</span><b class="num">'+fmt(td)+'</b></div><div class="rp-kpi"><span>عدد العمليات</span><b class="num">'+rows.length+'</b></div>';
    if(b&&b.kind==='project'){
      var paidAll=sum(paid(inBook(b.id)).filter(function(e){return e.cat===contractCat(b)&&(!rp.to||e.date<=rp.to)}));
      if(b.contract>0)k+='<div class="rp-kpi"><span>المتبقي من العقد</span><b class="num">'+fmt(b.contract-paidAll)+'</b></div>';
      else if(b.budget>0)k+='<div class="rp-kpi"><span>الميزانية</span><b class="num">'+fmt(b.budget)+'</b></div>';
    }
    k+='</div>';
    if(b&&b.kind==='project'&&(b.contract>0||b.budget>0))k+='<p style="margin:0;color:#5f6e66;font-size:12px">'+(b.contract>0?'قيمة عقد المقاول: <b class="num" style="color:#1b2520">'+fmt(b.contract)+'</b> '+esc(cur)+'. ':'')+(b.budget>0?'ميزانية المشروع: <b class="num" style="color:#1b2520">'+fmt(b.budget)+'</b> '+esc(cur)+'.':'')+'</p>';
    var groupKey=all?function(e){return e.book}:function(e){return e.cat};
    var gl=all?function(key){return book(key)?book(key).name:''}:function(key){return catOf(b,key).n};
    var by={}; P.forEach(function(e){var g=groupKey(e); by[g]=(by[g]||0)+e.amount});
    var t1=Object.keys(by).length?'<h2>'+(all?'حسب القسم':'حسب الفئة')+'</h2><table><thead><tr><th>'+(all?'القسم':'الفئة')+'</th><th class="n">النسبة</th><th class="n">المبلغ</th></tr></thead><tbody>'+
      Object.keys(by).sort(function(a,c){return by[c]-by[a]}).map(function(key){return '<tr><td>'+esc(gl(key))+'</td><td class="n">'+(tp?Math.round(by[key]/tp*100):0)+'%</td><td class="n">'+fmt(by[key])+'</td></tr>'}).join('')+'</tbody></table>':'';
    var bp={}; P.forEach(function(e){if(e.payee)bp[e.payee]=(bp[e.payee]||0)+e.amount});
    var t2=Object.keys(bp).length?'<h2>حسب الجهة</h2><table><thead><tr><th>الجهة</th><th class="n">المبلغ</th></tr></thead><tbody>'+Object.keys(bp).sort(function(a,c){return bp[c]-bp[a]}).slice(0,12).map(function(key){return '<tr><td>'+esc(key)+'</td><td class="n">'+fmt(bp[key])+'</td></tr>'}).join('')+'</tbody></table>':'';
    var showPayee=rows.some(function(e){return e.payee}), showMethod=rows.some(function(e){return e.method});
    var cols=2+(all?1:0)+(showPayee?1:0)+(showMethod?1:0)+2;
    var thead='<thead><tr><th style="width:84px">التاريخ</th>'+(all?'<th>القسم</th>':'')+'<th>الفئة</th>'+(showPayee?'<th>الجهة</th>':'')+(showMethod?'<th>الدفع</th>':'')+'<th>ملاحظة</th><th class="n">المبلغ</th></tr></thead>';
    function rowHtml(e){var due=e.status==='due'; return '<tr'+(due?' class="rp-due"':'')+'><td class="num" style="direction:ltr;text-align:right">'+e.date+'</td>'+(all?'<td>'+esc(book(e.book).name)+'</td>':'')+'<td>'+esc(cat(e).n)+'</td>'+(showPayee?'<td>'+esc(e.payee)+'</td>':'')+(showMethod?'<td>'+esc(e.method)+'</td>':'')+'<td>'+(due?'(مستحق) ':'')+esc([e.note,e.ref?'رقم '+e.ref:''].filter(Boolean).join(' · '))+'</td><td class="n">'+fmt(e.amount)+'</td></tr>'}
    var pages=[];
    function page(first){var p=document.createElement('div'); p.className='rp-page';
      p.innerHTML='<div class="rp-head"><div><h1>'+esc((first?'تقرير ':'')+rpTitle())+'</h1><p>الفترة: '+period+'</p></div><p>مصروفي · '+made+'</p></div><div class="rp-body"></div><div class="rp-foot"><span>المبالغ بال'+esc(cur)+(td?' · الأسطر البرتقالية دفعات مستحقة':'')+'</span><span class="pg"></span></div>';
      stage.appendChild(p); pages.push(p); return p.querySelector('.rp-body')}
    function fits(x){return x.scrollHeight<=x.clientHeight+1}
    var body=page(true); body.innerHTML=k+t1+t2;
    var h=document.createElement('h2'); h.textContent='تفاصيل العمليات'; body.appendChild(h);
    function table(x){var t=document.createElement('table'); t.innerHTML=thead+'<tbody></tbody>'; x.appendChild(t); return t.querySelector('tbody')}
    var tb=table(body);
    if(!fits(body)){h.remove(); tb.parentNode.remove(); body=page(false); body.appendChild(h); tb=table(body)}
    rows.forEach(function(e){tb.insertAdjacentHTML('beforeend',rowHtml(e)); if(!fits(body)){tb.lastElementChild.remove(); body=page(false); tb=table(body); tb.insertAdjacentHTML('beforeend',rowHtml(e))}});
    var tf=document.createElement('tfoot'); tf.innerHTML='<tr><td colspan="'+(cols-1)+'">المجموع المدفوع</td><td class="n">'+fmt(tp)+'</td></tr>'+(td?'<tr><td colspan="'+(cols-1)+'" style="border-top:0">المستحق</td><td class="n" style="border-top:0">'+fmt(td)+'</td></tr>':'');
    tb.parentNode.appendChild(tf);
    if(!fits(body)){tf.remove(); body=page(false); var t3=document.createElement('table'); t3.appendChild(tf); body.appendChild(t3)}
    pages.forEach(function(p,i){p.querySelector('.pg').textContent='صفحة '+(i+1)+' من '+pages.length});
    return pages;
  }
  function makeXlsx(btn){
    var rows=rpRows(); if(!rows.length){$('rpErr').textContent='ما في عمليات في هذه الفترة.'; return}
    $('rpErr').textContent=''; btn.disabled=true; var old=btn.textContent; btn.textContent='جاري التجهيز...';
    need('xlsx','https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',function(){return !!window.XLSX}).then(function(){
      var X=window.XLSX, wb=X.utils.book_new();
      var head=['التاريخ','القسم','الفئة','الحالة','الجهة','طريقة الدفع','رقم الفاتورة','ملاحظة','المبلغ'];
      var data=rows.map(function(e){return [e.date,book(e.book).name,cat(e).n,e.status==='due'?'مستحق':'مدفوع',e.payee||'',e.method||'',e.ref||'',e.note||'',e.amount]});
      var ws=X.utils.aoa_to_sheet([head].concat(data)); ws['!cols']=[{wch:11},{wch:18},{wch:16},{wch:8},{wch:18},{wch:12},{wch:12},{wch:30},{wch:12}];
      X.utils.book_append_sheet(wb,ws,'العمليات');
      var sumRows=[['القسم','الفئة','مدفوع','مستحق']], keys={};
      rows.forEach(function(e){var key=e.book+'|'+e.cat; keys[key]=keys[key]||[book(e.book).name,cat(e).n,0,0]; keys[key][e.status==='due'?3:2]+=e.amount});
      Object.keys(keys).forEach(function(key){sumRows.push(keys[key])});
      sumRows.push(['المجموع','',sum(paid(rows)),sum(dues(rows))]);
      var ws2=X.utils.aoa_to_sheet(sumRows); ws2['!cols']=[{wch:20},{wch:18},{wch:14},{wch:14}];
      X.utils.book_append_sheet(wb,ws2,'الملخص');
      wb.Workbook={Views:[{RTL:true}]};
      var out=X.write(wb,{bookType:'xlsx',type:'array'});
      return saveFile(rpFileBase()+'.xlsx',new Blob([out]),'تم حفظ ملف Excel');
    }).catch(function(){$('rpErr').textContent='تجهيز الملف يحتاج إنترنت. تأكد إنك متصل وجرب مرة ثانية.'})
      .then(function(){btn.disabled=false; btn.textContent=old});
  }

  // an invite link was opened: remember it until the person signs in
  function grabInvite(){var m=/^#invite=([0-9a-f]{32})$/.exec(location.hash); if(m){try{localStorage.setItem(IK,m[1])}catch(e){} try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}} return !!m}
  grabInvite();
  window.addEventListener('hashchange',function(){
    if(!grabInvite())return; cloud.inviteInfo=null; cloud.why='';
    if(cloud.user){if(cloud.blocked)enter(); else acceptInvite()} else{inviteInfo(); render()}
  });
  loadPrefs(); cloudLoad(); load(); runRecurring(); render();
  if(state.pin)showLock('unlock');
  cloudInit();
  setTimeout(function(){$('splash').classList.add('out'); setTimeout(function(){$('splash').hidden=true},400)},350);
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(function(){});
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='hidden'){if(state.pin&&$('lock').hidden)showLock('unlock')}
    else sync();
  });
  window.addEventListener('online',function(){if(cloud.sb)sync(); else cloudInit()});
  setInterval(function(){if(document.visibilityState==='visible')sync()},45000);
})();
</script>
